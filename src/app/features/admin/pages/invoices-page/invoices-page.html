<app-admin-filter-bar
  [selects]="selects()"
  [values]="list.filters()"
  (applied)="onFilters($event)"
  (cleared)="onReset()"
/>

<app-admin-table
  [columns]="columns()"
  [rows]="rows()"
  [state]="list.state()"
  [caption]="i18n.t('adminInvoices.title')"
  [total]="list.total()"
  [page]="list.page()"
  [pageSize]="list.pageSize"
  [emptyTitle]="i18n.t('adminInvoices.empty')"
  [emptyHint]="i18n.t('adminInvoices.emptyHint')"
  [errorTitle]="i18n.t('adminInvoices.error')"
  [errorHint]="i18n.t('adminInvoices.errorHint')"
  errorRef="ERR-5116"
  (pageChange)="onPage($event)"
  (retried)="fetch()"
  (clearedFilters)="onReset()"
>
  <ng-template #row let-row>
    <span class="cell cell--strong num" dir="ltr">{{ row.invoiceNo }}</span>
    <span class="cell">
      <app-ui-badge [tone]="typeTone(row.type)">{{ typeLabel(row.type) }}</app-ui-badge>
    </span>
    <span class="cell cell--muted num">{{ issuedAt(row) }}</span>
    <span class="cell cell--stack">
      <span class="cell__sub num" dir="ltr">{{ row.booking.referenceNo }}</span>
      <span class="cell--muted" dir="auto">{{ row.booking.unit.title }}</span>
    </span>
    <span class="cell cell--muted num">{{ row.taxableHalalas }}</span>
    <!-- The rate the document was issued under, beside the amount: a register
         read next year must still show the VAT that was actually charged. -->
    <span class="cell cell--muted num">
      {{ row.vatHalalas }}
      @if (row.vatRateBps > 0) {
        <span class="unit num" dir="ltr">{{ row.vatRateBps / 100 }}%</span>
      }
    </span>
    <span class="cell cell--strong num">
      {{ row.totalHalalas }} <span class="unit">{{ i18n.t('admin.sar') }}</span>
    </span>
  </ng-template>
</app-admin-table>
