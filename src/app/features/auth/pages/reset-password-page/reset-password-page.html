@if (!hasToken()) {
  <app-ui-empty-state
    tone="error"
    [title]="i18n.t('reset.invalidLink')"
    [hint]="i18n.t('reset.invalidLinkHint')"
  >
    <a appUiButton variant="primary" routerLink="/auth/forgot-password">
      {{ i18n.t('forgot.send') }}
    </a>
  </app-ui-empty-state>
} @else if (done()) {
  <section class="authForm">
    <header class="authForm__head">
      <span class="sentMark sentMark--ok" aria-hidden="true">✓</span>
      <h1 class="authForm__title">{{ i18n.t('reset.doneTitle') }}</h1>
      <p class="authForm__sub">{{ i18n.t('reset.doneBody') }}</p>
    </header>

    <a appUiButton variant="primary" size="lg" [fullWidth]="true" routerLink="/auth/login">
      {{ i18n.t('public.signIn') }}
    </a>
  </section>
} @else {
  <form class="authForm" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header class="authForm__head">
      <h1 class="authForm__title">{{ i18n.t('reset.title') }}</h1>
      <p class="authForm__sub">{{ i18n.t('reset.sub') }}</p>
    </header>

    @if (error()) {
      <app-ui-notice tone="danger">{{ error() }}</app-ui-notice>
    }

    <app-ui-field
      [label]="i18n.t('account.newPassword')"
      for="rp-new"
      [control]="form.controls.newPassword"
      [hint]="i18n.t('password.rule')"
    >
      <input
        id="rp-new"
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
      />
      <app-ui-password-strength [value]="password()" />
    </app-ui-field>

    <app-ui-field
      [label]="i18n.t('account.confirmPassword')"
      for="rp-confirm"
      [control]="form.controls.confirmPassword"
    >
      <input
        id="rp-confirm"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
      />
    </app-ui-field>

    <button appUiButton variant="primary" size="lg" [fullWidth]="true" [disabled]="submitting()">
      {{ i18n.t('reset.action') }}
    </button>
  </form>
}
