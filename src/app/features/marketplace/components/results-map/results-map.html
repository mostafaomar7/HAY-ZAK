<section class="map" (mouseleave)="hovered.emit(null)">
  <span class="map__grid" aria-hidden="true"></span>
  <span class="map__road map__road--v" aria-hidden="true"></span>
  <span class="map__road map__road--h" aria-hidden="true"></span>

  @if (cityLabel()) {
    <div class="map__badge">
      <span class="map__city">{{ cityLabel() }}</span>
      <span class="map__hint">{{ i18n.t('results.mapAreaHint') }}</span>
    </div>
  }

  <!-- One disc per result: the area the API vouches for, not a position. -->
  @for (disc of discs(); track disc.id) {
    <button
      type="button"
      class="disc"
      [class.disc--active]="disc.id === activeId()"
      [style.top]="disc.top"
      [style.inset-inline-end]="disc.end"
      [style.width]="disc.size"
      [attr.aria-label]="disc.title"
      (mouseenter)="hovered.emit(disc.id)"
      (focus)="hovered.emit(disc.id)"
      (blur)="hovered.emit(null)"
    >
      <span class="disc__price num" dir="ltr">{{ disc.price }}</span>
      <span class="disc__currency">{{ i18n.t('common.currency') }}</span>
    </button>
  }

  <p class="map__status" aria-live="polite">
    {{ hoveredTitle() || i18n.t('results.mapHoverHint') }}
  </p>
</section>
