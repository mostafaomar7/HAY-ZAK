<header class="bar">
  <button
    class="bar__menu"
    type="button"
    [attr.aria-label]="i18n.t('adminNav.menu')"
    (click)="openMenu.emit()"
  >
    <app-ui-icon name="list" [size]="20" />
  </button>

  <h1 class="bar__title">{{ title() }}</h1>

  <div class="bar__tools">
    <button
      class="bar__icon"
      type="button"
      [attr.aria-label]="i18n.t('topbar.language')"
      (click)="i18n.toggle()"
    >
      <app-ui-icon name="globe" [size]="19" />
      <span class="bar__lang">{{ i18n.language() === 'ar' ? 'AR' : 'EN' }}</span>
    </button>

    <!-- The real one. What used to sit here was an icon linking to the
         dashboard with a badge counting listings awaiting review — labelled
         "الإشعارات", and it had never shown one. -->
    <app-ui-notification-bell allRoute="/admin/notifications" />

    <span class="bar__rule" aria-hidden="true"></span>

    <div class="account" (appClickOutside)="closeAll()">
      <button
        class="account__trigger"
        type="button"
        [attr.aria-expanded]="accountOpen()"
        (click)="toggleAccount()"
      >
        <span class="account__text">
          <span class="account__name">{{ auth.user()?.fullName }}</span>
          <span class="account__role">{{ roleLabel() }}</span>
        </span>
        <span class="account__avatar" aria-hidden="true">
          {{ initials(auth.user()?.fullName ?? '') }}
        </span>
      </button>

      @if (accountOpen()) {
        <div class="menu" role="menu">
          <div class="menu__head">
            <span class="menu__name">{{ auth.user()?.fullName }}</span>
            <span class="menu__role">{{ roleLabel() }}</span>
          </div>
          <button
            class="menu__item menu__item--danger"
            type="button"
            role="menuitem"
            (click)="loggedOut.emit()"
          >
            {{ i18n.t('topbar.logout') }}
          </button>
        </div>
      }
    </div>
  </div>
</header>
